name: Deploy site

on:
        push:
                branches: ["main"]
                paths-ignore:
                        - "*.md"
                        - ".**"
                        - "!.github/workflows"
                        - "*LICENSE*"
        workflow_dispatch:

permissions:
        contents: read
        pages: write
        id-token: write

concurrency:
        group: "pages"
        cancel-in-progress: false

jobs:
        deploy:
                environment:
                        name: github-pages
                        url: ${{ steps.deployment.outputs.page_url }}
                runs-on : ubuntu-latest
                steps:
                        # Repos
                        - name: Checkout the repo
                          uses: actions/checkout@v7
                        - name: Checkout the burger thing
                          uses: actions/checkout@v7
                          with:
                                repository: "MrSaturnIdk/stare-at-burger"
                                path: "web/stare-at-burger"
                        - name: Checkout the font thing
                          uses: actions/checkout@v7
                          with:
                                repository: "MrSaturnIdk/font-size-tester"
                                path: "web/font-size-tester"
                        - name: Checkout the list library
                          uses: actions/checkout@v7
                          with:
                                repository: "MrSaturnIdk/small-list-utils"
                                path: ".slu"
                                fetch-depth: 0

                        # Toolchain
                        - name: Install doxygen
                          run: |
                                sudo apt-get update
                                sudo apt-get install doxygen graphviz

                        # Self made
                        - name: Make docs for small-list-utils
                          run: |
                                cd .slu
                                i=0
                                content=""
                                stable_ver=""
                                for tag in $(git tag --sort=-v:refname); do
                                        latest=""
                                        stable=""
                                        if [ "$i" -eq 0 ]; then
                                                stable_ver="$(cat stable.txt)"
                                                latest=" (Latest)"
                                                i=$((i + 1))
                                        fi
                                        if [ "$tag" = "$stable_ver" ]; then
                                                stable=" (Latest Stable)"
                                        fi
                                        content="${content} <li><a href=\"${tag}/\">${tag}${latest}${stable}</a></li>"
                                        git switch --detach "$tag" || git checkout --detach "$tag" || git checkout "$tag"
                                        doxygen
                                        mv docs/html "../projects/small-list-utils/$tag"
                                        rm -rf docs
                                done
                                cd ..
                                sed -i "s|__THE_CONTENT__|${content}|" projects/small-list-utils/index.html
                        - name: Remove useless files
                          run: |
                                rm README.md LICENSE web/stare-at-burger/README.md web/stare-at-burger/LICENSE
                                rm web/font-size-tester/README.md web/font-size-tester/LICENSE

                        # Premade crap
                        - name: Configure site
                          uses: actions/configure-pages@v6
                        - name: Upload site artifact
                          uses: actions/upload-pages-artifact@v5
                          with:
                                name: "${{ github.run_id }}-${{ github.run_attempt }}"
                                path: "."
                        - name: Deploy site
                          id: deployment
                          uses: actions/deploy-pages@v5
                          with:
                                artifact_name: "${{ github.run_id }}-${{ github.run_attempt }}"
